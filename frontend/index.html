<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人机验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            padding: 20px;
        }

        .card {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #999;
            font-size: 15px;
            margin-bottom: 32px;
        }

        .cf-turnstile {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .loading {
            display: none;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #e0e0e0;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #999;
            font-size: 14px;
        }

        .success-message,
        .error-message {
            display: none;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .success-icon,
        .error-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .back-btn {
            margin-top: 20px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="card" id="verifyCard">
        <div class="icon">🤖</div>
        <h1>人机验证</h1>
        <p class="subtitle">请完成下方验证以继续</p>
        <div class="cf-turnstile" id="turnstileWidget"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">正在验证...</p>
        </div>
    </div>

    <div class="card" id="successCard" style="display: none;">
        <div class="success-icon">✅</div>
        <h1>验证成功</h1>
        <p class="subtitle">你可以返回 Telegram 继续对话了</p>
    </div>

    <div class="card" id="errorCard" style="display: none;">
        <div class="error-icon">❌</div>
        <h1>验证失败</h1>
        <p class="subtitle">请点击下方按钮重试</p>
        <button class="back-btn" onclick="resetVerify()">重试</button>
    </div>

    <script>
        const WORKER_URL = ''; // 填写你的 Worker URL，例如 'https://your-worker.your-name.workers.dev'
        const TURNSTILE_SITE_KEY = ''; // 填写你的 Turnstile Site Key
        let currentToken = '';

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        async function initializeTurnstile() {
            currentToken = getQueryParam('token');
            if (!currentToken) {
                showError('无效的验证链接');
                return;
            }

            if (!TURNSTILE_SITE_KEY) {
                showError('Turnstile 配置缺失');
                return;
            }

            window.onTurnstileSuccess = async function(token) {
                showLoading(true);
                try {
                    const response = await fetch(`${WORKER_URL}/public/turnstile/verify/${currentToken}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            'cf-turnstile-response': token,
                            'token': currentToken
                        })
                    });

                    const result = await response.json();
                    if (result.success) {
                        showSuccess();
                    } else {
                        showError('验证失败，请重试');
                    }
                } catch (error) {
                    console.error(error);
                    showError('网络错误，请重试');
                } finally {
                    showLoading(false);
                }
            };

            const script = document.createElement('script');
            script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            script.async = true;
            script.defer = true;
            script.onload = function() {
                window.turnstile.render('#turnstileWidget', {
                    sitekey: TURNSTILE_SITE_KEY,
                    callback: window.onTurnstileSuccess,
                    theme: 'dark'
                });
            };
            document.body.appendChild(script);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showSuccess() {
            document.getElementById('verifyCard').style.display = 'none';
            document.getElementById('errorCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
        }

        function showError(message) {
            if (message) {
                document.querySelector('#errorCard .subtitle').textContent = message;
            }
            document.getElementById('verifyCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'none';
            document.getElementById('errorCard').style.display = 'block';
        }

        function resetVerify() {
            document.getElementById('errorCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'none';
            document.getElementById('verifyCard').style.display = 'block';
            if (window.turnstile) {
                window.turnstile.reset('#turnstileWidget');
            }
        }

        document.addEventListener('DOMContentLoaded', initializeTurnstile);
    </script>
</body>
</html>
